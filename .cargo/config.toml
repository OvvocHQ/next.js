# !! DO NOT EDIT — generated by scripts/cargo/generate-cargo-config.sh !!

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
TURBO_PNPM_WORKSPACE_DIR = { value = "", relative = true }

[alias]
xtask = "run --package xtask --"

[build]
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0"
]
rustdocflags = []

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0",
  "-C",
  "target-feature=+crt-static"
]

[target.i686-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0",
  "-C",
  "target-feature=+crt-static"
]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0",
  "-Zunstable-options",
  "-Clinker-flavor=gnu-lld-cc",
  "-Clink-self-contained=+linker"
]

[target.aarch64-unknown-linux-musl]
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0",
  "-Ctarget-feature=-crt-static",
  "-Clink-arg=-lgcc",
  "-Zunstable-options",
  "-Clinker-flavor=gnu-lld-cc",
  "-Clink-self-contained=+linker"
]

[target.x86_64-unknown-linux-musl]
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zshare-generics=y",
  "-Zthreads=8",
  "-Csymbol-mangling-version=v0",
  "-Ctarget-feature=-crt-static",
  "-Zunstable-options",
  "-Clinker-flavor=gnu-lld-cc",
  "-Clink-self-contained=+linker"
]

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.wasm32-unknown-unknown]
rustflags = [
  "-Zshare-generics=y",
  "--cfg",
  "getrandom_backend=\"wasm_js\""
]
